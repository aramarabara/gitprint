[project]
name = "gitprint"
version = "0.1.0"
description = "Code Provenance Intelligence — verify who really wrote your code. Stylometric author fingerprinting via git mining + pretrained code embeddings."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gitprint" }]
keywords = ["security", "supply-chain", "attribution", "stylometry", "code-quality", "obfuscation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "numpy>=1.26",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.31"]
llama = ["llama-cpp-python>=0.3"]
test = ["pytest>=8"]

[project.scripts]
gitprint = "gitprint.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gitprint"]
